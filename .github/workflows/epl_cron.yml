name: EPL Auto Pipeline

on:
  schedule:
    # 22:00 KST (13:00 UTC) - 매일 밤 22시 당일 라인업/WUV 예측 반영
    - cron: '0 13 * * *'
    # 08:00 KST (23:00 UTC) - 매일 아침 8시 경기 결과 및 적중률 자동 채점
    - cron: '0 23 * * *'
  workflow_dispatch: # 관리자 전용 수동 실행 버튼 (Actions 탭)

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy streamlit altair

      - name: Run EPL Pipeline (Fetch ESPN API & Update Database)
        run: |
          python run_epl.py

      - name: Commit and Push DB Updates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add epl_data.db
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: update epl_data.db via GitHub Actions" && git push)
