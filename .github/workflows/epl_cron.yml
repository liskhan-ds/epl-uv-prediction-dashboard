name: EPL Auto Pipeline

on:
  schedule:
    # 매일 밤 20:15 KST (11:15 UTC) - 당일 라인업/WUV 예측 반영
    - cron: '15 11 * * *'
    # 매일 아침 06:15 KST (21:15 UTC) - 경기 결과 및 적중률 자동 채점
    - cron: '15 21 * * *'
  workflow_dispatch: # 관리자 전용 수동 실행 버튼 (Actions 탭)

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pandas numpy streamlit altair
      - name: Run EPL Pipeline
        run: python run_epl.py
      - name: Commit & Push DB Updates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          git add epl_data.db
          if ! git diff --staged --quiet; then
            git commit -m "auto: update epl_data.db via GitHub Actions"
            git push origin main
          else
            echo "No changes in epl_data.db to commit."
          fi
